# https://docs.github.com/en/actions

name: "Documentation"

on: # yamllint disable-line rule:truthy
    push:
        branches:
            - "2.x"
    workflow_dispatch: null

permissions:
    contents: read

jobs:
    run:
        permissions:
            contents: read  # for phpDocumentor/.github/.github/workflows/documentation.yml to fetch code
            pull-requests: read  # for phpDocumentor/.github/.github/workflows/documentation.yml to fetch pull requests
        name: "Documentation"
        uses: "phpDocumentor/.github/.github/workflows/documentation.yml@main"
        with:
            deploy: true
            component: "type-resolver"
        secrets:
            token: "${{ secrets.BOT_TOKEN }}"
